name: Reliability checks
on:
  pull_request:
    branches: [main, master]
  push:
    branches: ['fix/arcade-score-identity']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build exact client revision
        env:
          HOF_SOURCE_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Archive checked client
        uses: actions/upload-artifact@v6.0.0
        with:
          name: checked-client
          path: dist
          retention-days: 14
          if-no-files-found: error
      - run: npm run build:server
