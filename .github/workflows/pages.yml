name: Deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      client_only:
        description: Publish the checked custom-domain client without Pages changes
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/checks.yml
  build-pages:
    if: ${{ !inputs.client_only }}
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Pages client
        env:
          HOF_SOURCE_REVISION: ${{ github.sha }}
        run: npm run build -- --base "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.0
  deploy-client:
    needs: qualify
    uses: ./.github/workflows/deploy-client.yml
    secrets: inherit
